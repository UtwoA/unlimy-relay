services:
  postgres:
    image: postgres:16
    container_name: relay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: relay-redis
    ports:
      - "6379:6379"

  master-api:
    build: .
    container_name: relay-master-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"

  worker:
    build: .
    container_name: relay-worker
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      - master-api

  beat:
    build: .
    container_name: relay-beat
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      - worker

  bot-service:
    build:
      context: .
      dockerfile: app/bot_service/Dockerfile
    container_name: relay-bot-service
    env_file:
      - .env
    depends_on:
      - master-api
    ports:
      - "8090:8090"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: relay-web
    environment:
      MASTER_PUBLIC_API: http://master-api:8080/api/v1
    depends_on:
      - master-api
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: relay-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: relay-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana_data:
