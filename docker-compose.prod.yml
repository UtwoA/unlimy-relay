services:
  postgres:
    image: postgres:16
    container_name: relay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - relay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: relay-redis
    restart: unless-stopped

  master-api:
    build: .
    container_name: relay-master-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "18080:8080"
    restart: unless-stopped

  worker:
    build: .
    container_name: relay-worker
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      - master-api
    restart: unless-stopped

  beat:
    build: .
    container_name: relay-beat
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      - worker
    restart: unless-stopped

  bot-service:
    build:
      context: .
      dockerfile: app/bot_service/Dockerfile
    container_name: relay-bot-service
    env_file:
      - .env
    depends_on:
      - master-api
    ports:
      - "18090:8090"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: relay-web
    environment:
      MASTER_PUBLIC_API: http://master-api:8080/api/v1
    depends_on:
      - master-api
    ports:
      - "13000:3000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: relay-prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - relay_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "19090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: relay-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - relay_grafana_data:/var/lib/grafana
    ports:
      - "13001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  relay_pgdata:
  relay_prometheus_data:
  relay_grafana_data:
